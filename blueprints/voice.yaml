blueprint:
  name: HelloFresh Recipe Step Display
  domain: script
  source_url: https://github.com/pantherale0/ha-hellofresh/blob/main/blueprints/voice.yaml
  author: pantherale0
  description: >
    Show HelloFresh cooking steps on an Ava display (via webview_command + Browser
    Mod) and answer follow-up questions about the recipe currently on screen.


    Assist passes the current `assist_satellite` entity. The script derives the Ava
    ESPHome action
    `esphome.<device>_webview_command` from that entity id, for example:


    `assist_satellite.echo_show_8_630d_voice_assistant_assist_satellite`


    → `esphome.echo_show_8_630d_voice_assistant_webview_command`


    Cooking context is stored per area in Saver (for example
    `kitchen_hellofresh_active_recipe_id`). Area comes from Assist location context,
    or from the satellite’s assigned area when omitted.


    ## Requirements


    - [Saver](https://github.com/PiotrMachowski/Home-Assistant-custom-components-Saver)
      installed via HACS

    - Ava with Advanced Control / browser commands enabled

    - Ava browser showing a Home Assistant dashboard with Browser Mod loaded

    - Browser Mod installed in Home Assistant


    ## Setup


    1. Install and set up the Saver integration.

    2. Create one script from this blueprint (works for all Ava satellites).

       Optionally set `default_satellite` / `default_area` for Dev Tools testing.

    3. Expose the script to Assist.

    4. Enable the HelloFresh LLM API on your conversation agent.

    5. Keep the script description below — Assist uses it to decide when and how
       to call this tool. Do not clear it when renaming the script.


    ## Example voice use


    - "Show step 2 of creamy chicken pasta" → resolve `recipe_id`, then
      `action=show` with `step=2`, plus `satellite` (and `area`) from Assist context.

    - "Show me step 2" / "Next step" / "Go back a step" → `action=show` with
      `step`, or `action=next` / `action=previous` using Saver context for that area.

    - "What ingredients are needed in this step?" → `action=info` (omit
      `recipe_id` and `step`).
  input:
    size:
      name: Popup size
      default: wide
      selector:
        select:
          options:
            - normal
            - wide
            - fullscreen
    default_satellite:
      name: Default Assist satellite
      description: >
        Optional fallback assist_satellite entity when Assist omits satellite (useful
        for Developer Tools). Example:
        assist_satellite.echo_show_8_630d_voice_assistant_assist_satellite
      default:
      selector:
        entity:
          domain: assist_satellite
    default_area:
      name: Default area
      description: >
        Fallback room slug when Assist omits area and the satellite has no area
        (for example kitchen).
      default: kitchen
      selector:
        text:

mode: restart

description: >
  Show HelloFresh cooking steps on the Ava display for the current Assist
  satellite and answer questions about the recipe on screen. Arguments: action
  (required), satellite (current assist_satellite entity_id), area (optional),
  recipe_id (optional), step (optional, 1-based). Always set satellite from the
  Assist device handling this request. Always set area from conversation location
  when known; otherwise the script uses the satellite’s area. User need not name
  a room. Use action="show" to display a step; "next"/"previous" to move one step
  in that area’s saved recipe; "info" for questions about the loaded recipe/step.
  For a new recipe, resolve recipe_id with HelloFresh tools
  (SearchHelloFreshRecipes, GetHelloFreshDeliverySummary, GetHelloFreshRecipe),
  then call action="show" with recipe_id, step (default 1), satellite, and area.
  For the current recipe use action="show" with step only, or next/previous
  without step. Do not invent recipe_ids. Speak the tool response.

fields:
  action:
    name: Action
    description: >-
      Required. show=display a step; next/previous=move one step; info=answer
      questions about the loaded recipe/step.
    required: true
    selector:
      select:
        options:
          - show
          - next
          - previous
          - info
  satellite:
    name: Assist satellite
    description: >-
      Current assist_satellite entity_id for this request. Always set from Assist
      context; used to derive the Ava webview_command.
    required: false
    selector:
      entity:
        domain: assist_satellite
  area:
    name: Area
    description: >-
      Current Assist area/location for this request (slug). Always set from
      conversation context; user need not name the room.
    required: false
    selector:
      text:
  recipe_id:
    name: Recipe ID
    description: >-
      HelloFresh recipe id from HelloFresh search/delivery tools. Omit to use the
      recipe already on screen.
    required: false
    selector:
      text:
  step:
    name: Step
    description: >-
      Absolute 1-based step for action=show or info. Omit for next/previous and
      when keeping the on-screen step.
    required: false
    selector:
      number:
        min: 1
        mode: box

sequence:
  - variables:
      popup_size: !input size
      default_area: !input default_area
      default_satellite: !input default_satellite
      requested_action: "{{ action | default('show') | string | lower | trim }}"
      effective_satellite: >-
        {% set from_field = satellite | default('', true) | string | trim %}
        {%- if from_field not in ['', 'none', 'None'] -%}
        {{- from_field -}}
        {%- else -%}
        {{- default_satellite | default('', true) | string | trim -}}
        {%- endif -%}
      webview_command: >-
        {%- set sat = effective_satellite -%}
        {%- if sat in ['', 'none', 'None'] -%}
        {%- else -%}
        {%- set oid = sat.split('.')[1] if '.' in sat else sat -%}
        {{- 'esphome.' ~ (oid | regex_replace('_assist_satellite$', '')) ~ '_webview_command' -}}
        {%- endif -%}
      area_from_satellite: >-
        {%- if effective_satellite not in ['', 'none', 'None'] -%}
        {{- area_name(effective_satellite) | default('', true) -}}
        {%- endif -%}
      area_slug: >-
        {%- set raw = area | default(area_from_satellite, true) | default(default_area, true) | string | trim | lower -%}
        {{- raw | regex_replace('[^a-z0-9]+', '_') | regex_replace('^_|_$', '') -}}

  - if:
      - condition: template
        value_template: "{{ area_slug in ['', 'none', 'None', 'unknown', 'unavailable'] }}"
    then:
      - variables:
          voice_response:
            response: >
              No area available for cooking context. Pass area from the current
              Assist location, or set default_area on the script.
      - stop: "{{ voice_response.response }}"
        response_variable: voice_response

  - variables:
      saver_recipe_id_key: "{{ area_slug }}_hellofresh_active_recipe_id"
      saver_step_key: "{{ area_slug }}_hellofresh_active_step"
      saver_recipe_name_key: "{{ area_slug }}_hellofresh_active_recipe_name"
      stored_step: >-
        {%- set stored = saver.variable(area_slug ~ '_hellofresh_active_step') -%}
        {{- stored | int(1) if stored not in [none, '', 'none', 'None'] else 1 -}}
      effective_recipe_id: >-
        {% set from_field = recipe_id | default('', true) | string | trim %}
        {%- if from_field not in ['', 'none', 'None'] -%}
        {{- from_field -}}
        {%- else -%}
        {%- set stored = saver.variable(area_slug ~ '_hellofresh_active_recipe_id') -%}
        {{- stored | default('', true) | string | trim -}}
        {%- endif -%}
      requested_step: >-
        {% set from_field = step | default(none, true) %}
        {%- if from_field not in [none, '', 'none', 'None'] -%}
        {{- from_field | int(1) -}}
        {%- else -%}
        {{- none -}}
        {%- endif -%}

  - if:
      - condition: template
        value_template: "{{ effective_recipe_id in ['', 'unknown', 'unavailable', 'none', 'None'] }}"
    then:
      - variables:
          voice_response:
            response: >
              No recipe loaded for {{ area_slug }}. Resolve a HelloFresh recipe_id
              with HelloFresh tools, then call again with action=show and that
              recipe_id.
      - stop: "{{ voice_response.response }}"
        response_variable: voice_response

  - action: hellofresh.get_recipe
    data:
      recipe_id: "{{ effective_recipe_id }}"
    response_variable: recipe_response

  - variables:
      recipe: >-
        {{ recipe_response.recipe if recipe_response.recipe is defined else recipe_response }}
      steps: "{{ recipe.steps | default([]) }}"
      step_count: "{{ steps | length }}"
      name: "{{ recipe.name | default('HelloFresh recipe') }}"
      image: "{{ recipe.image_link | default('', true) }}"
      step_number: >-
        {%- set count = step_count | int(0) -%}
        {%- set current = stored_step | int(1) -%}
        {%- if requested_action == 'next' -%}
        {{- current + 1 -}}
        {%- elif requested_action == 'previous' -%}
        {{- current - 1 -}}
        {%- elif requested_step not in [none, '', 'none', 'None'] -%}
        {{- requested_step | int(1) -}}
        {%- else -%}
        {{- current -}}
        {%- endif -%}

  - if:
      - condition: template
        value_template: "{{ step_count | int == 0 }}"
    then:
      - variables:
          voice_response:
            response: "No cooking steps were returned for {{ name }}."
      - stop: "{{ voice_response.response }}"
        response_variable: voice_response

  - if:
      - condition: template
        value_template: "{{ requested_action == 'next' and step_number | int > step_count | int }}"
    then:
      - variables:
          voice_response:
            response: >
              Already on the last step ({{ step_count }}) for {{ name }}.
      - stop: "{{ voice_response.response }}"
        response_variable: voice_response

  - if:
      - condition: template
        value_template: "{{ requested_action == 'previous' and step_number | int < 1 }}"
    then:
      - variables:
          voice_response:
            response: "Already on the first step for {{ name }}."
      - stop: "{{ voice_response.response }}"
        response_variable: voice_response

  - variables:
      idx: "{{ [step_number | int(1) - 1, 0] | max }}"
      step_data: "{{ steps[idx] if step_count | int > idx | int else none }}"
      instructions: "{{ step_data.instructions if step_data else '' }}"
      utensils: >-
        {%- if step_data and step_data.utensils is defined -%}
        {{- step_data.utensils | join(', ') -}}
        {%- endif -%}
      ingredient_names: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for item in recipe.ingredients | default([]) -%}
        {%- if item.name is defined and item.name -%}
        {%- set ns.items = ns.items + [item.name] -%}
        {%- endif -%}
        {%- endfor -%}
        {{- ns.items | join(', ') -}}

  - if:
      - condition: template
        value_template: "{{ step_data is none or step_number | int < 1 or step_number | int > step_count | int }}"
    then:
      - variables:
          voice_response:
            response: >
              Could not find step {{ step_number }} for {{ name }}.
              This recipe has {{ step_count }} step(s).
      - stop: "{{ voice_response.response }}"
        response_variable: voice_response

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ requested_action == 'info' }}"
        sequence:
          - variables:
              voice_response:
                response: >
                  {{ name }} — step {{ step_number }} of {{ step_count }}
                  ({{ area_slug }}).
                  Instructions: {{ instructions }}
                  {% if utensils | trim %}
                  Utensils: {{ utensils }}.
                  {% endif %}
                  Recipe ingredients: {{ ingredient_names if ingredient_names else 'none listed' }}.
                  Note: HelloFresh does not provide per-step ingredient lists; use the
                  instructions plus the full ingredient list above.
          - stop: "{{ voice_response.response }}"
            response_variable: voice_response
    default:
      - if:
          - condition: template
            value_template: "{{ webview_command in ['', 'none', 'None'] }}"
        then:
          - variables:
              voice_response:
                response: >
                  No Assist satellite available to target an Ava display. Pass
                  satellite from Assist context, or set default_satellite on the
                  script.
          - stop: "{{ voice_response.response }}"
            response_variable: voice_response
      - action: saver.set_variable
        data:
          name: "{{ saver_recipe_id_key }}"
          value: "{{ effective_recipe_id }}"
      - action: saver.set_variable
        data:
          name: "{{ saver_step_key }}"
          value: "{{ step_number }}"
      - action: saver.set_variable
        data:
          name: "{{ saver_recipe_name_key }}"
          value: "{{ name }}"
      - variables:
          popup_style: >-
            {{ 'normal' if popup_size == 'normal' else (popup_size | default('wide')) }}
          ava_command: >-
            {%- set md = '### Step ' ~ step_number ~ ' of ' ~ step_count ~ '\n\n' ~ (instructions | default('', true)) -%}
            {%- set ns = namespace(cards=[]) -%}
            {%- if image | default('', true) | trim -%}
            {%- set ns.cards = ns.cards + [{
              'type': 'picture',
              'image': image,
              'alt_text': name ~ ' step ' ~ step_number
            }] -%}
            {%- endif -%}
            {%- set ns.cards = ns.cards + [{
              'type': 'markdown',
              'content': md
            }] -%}
            {%- set popup_data = {
              'title': name ~ ' — Step ' ~ step_number ~ ' of ' ~ step_count,
              'initial_style': popup_style,
              'content': {
                'type': 'vertical-stack',
                'cards': ns.cards
              }
            } -%}
            {%- set eval_js =
              "(()=>{const ha=document.querySelector('home-assistant');"
              ~ "if(!ha){console.error('HelloFresh voice: no home-assistant element');return;}"
              ~ "const ev=new Event('ll-custom',{bubbles:true,composed:true});"
              ~ "ev.detail={browser_mod:{service:'browser_mod.popup',data:"
              ~ (popup_data | tojson)
              ~ "}};ha.dispatchEvent(ev);})();"
            -%}
            {{ {'eval': eval_js} | tojson }}
      - action: "{{ webview_command }}"
        data:
          command: "{{ ava_command }}"
      - variables:
          voice_response:
            response: >
              Showing step {{ step_number }} of {{ step_count }} for {{ name }}
              in {{ area_slug }}.
      - stop: "{{ voice_response.response }}"
        response_variable: voice_response
